name: Tests

on:
  push:
    branches: [main,dev]
  pull_request:
    branches: [main,dev]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pytest psutil


      - name: Run tests
        run: pytest teasts / -v
